<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Foysal Bin Islam, BSc Computer Science at Brunel University London">
  <defs>
    <radialGradient id="glow" cx="76%" cy="50%" r="55%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="barfill" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="838" height="218" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 700 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -.5px; }
    .sub { font: 400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .tag { font: 400 13px ui-monospace, 'SF Mono', Consolas, monospace; fill: #58a6ff; }
    .cursor { fill: #58a6ff; animation: blink 1.1s steps(1) infinite; }
    .bar { stroke: url(#barfill); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120; animation: draw 1.2s ease-out .2s backwards; }
    .link { stroke: #30363d; stroke-width: 1.25; fill: none; }
    .flow { stroke: url(#accent); stroke-width: 1.5; fill: none; stroke-dasharray: 3 15; animation: flow 2.6s linear infinite; opacity: .9; }
    .node { fill: #0d1117; stroke: #58a6ff; stroke-width: 1.75; }
    .core { fill: #58a6ff; animation: pulse 2.6s ease-in-out infinite; }
    .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 2s; }
    .ring { fill: none; stroke: #58a6ff; stroke-width: 1.25; transform-origin: 668px 110px; animation: ring 2.6s ease-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .flow, .core, .ring { animation: none; }
      .bar { animation: none; }
      .ring { opacity: 0; }
    }
  </style>
  <rect x="1" y="1" width="838" height="218" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#card)">
    <rect x="420" y="0" width="420" height="220" fill="url(#dots)"/>
    <rect x="0" y="0" width="840" height="220" fill="url(#glow)"/>
  </g>

  <text x="48" y="74" class="tag">~/foysalbinislam <tspan class="cursor">&#9612;</tspan></text>
  <text x="48" y="124" class="name">Foysal Bin Islam</text>
  <line class="bar" x1="50" y1="142" x2="170" y2="142"/>
  <text x="48" y="172" class="sub">BSc Computer Science, Brunel University London</text>

  <g>
    <path class="link" d="M668 110 L590 58 M668 110 L752 62 M668 110 L604 166 M668 110 L748 162 M590 58 L520 96 M752 62 L800 110 M604 166 L528 150 M748 162 L800 110 M520 96 L528 150"/>
    <path class="flow" d="M668 110 L590 58 M668 110 L752 62 M668 110 L604 166 M668 110 L748 162"/>
    <circle class="ring" cx="668" cy="110" r="14"/>
    <circle class="node" cx="668" cy="110" r="14"/><circle fill="#58a6ff" cx="668" cy="110" r="5.5"/>
    <circle class="node" cx="590" cy="58" r="9"/><circle class="core" cx="590" cy="58" r="3.5"/>
    <circle class="node" cx="752" cy="62" r="9"/><circle class="core d2" cx="752" cy="62" r="3.5"/>
    <circle class="node" cx="604" cy="166" r="9"/><circle class="core d3" cx="604" cy="166" r="3.5"/>
    <circle class="node" cx="748" cy="162" r="9"/><circle class="core d4" cx="748" cy="162" r="3.5"/>
    <circle class="node" cx="520" cy="96" r="6"/><circle class="core d5" cx="520" cy="96" r="2.2"/>
    <circle class="node" cx="800" cy="110" r="6"/><circle class="core d3" cx="800" cy="110" r="2.2"/>
    <circle class="node" cx="528" cy="150" r="6"/><circle class="core d2" cx="528" cy="150" r="2.2"/>
  </g>
</svg>
